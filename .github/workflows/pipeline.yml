name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
          if [ "$BRANCH" = "main" ]; then
            echo "IMAGE_TAG=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.IMAGE_NAME_LOWER }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.IMAGE_NAME_LOWER }}:${{ github.ref_name }}-latest

      - name: Install vcluster CLI
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          sudo install -c -m 0755 vcluster /usr/local/bin
          rm -f vcluster
          vcluster version

      - name: Create vcluster
        run: |
          vcluster create mycluster --driver docker --connect=false
          sleep 10

      - name: Connect to vcluster
        run: |
          vcluster connect mycluster --print > kubeconfig.yaml &
          sleep 20
          export KUBECONFIG=$(pwd)/kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
          kubectl get namespaces

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Helm dependency update
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update helm/app-chart

      - name: Helm deploy
        run: |
          helm upgrade --install myapp helm/app-chart \
            --namespace default \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.tag.outputs.IMAGE_NAME_LOWER }} \
            --set image.tag=${{ steps.tag.outputs.IMAGE_TAG }} \
            --wait --timeout 5m

      - name: Run smoke test
        run: |
          chmod +x ./scripts/test.sh
          ./scripts/test.sh