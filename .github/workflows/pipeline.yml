name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$BRANCH" = "main" ]; then
            echo "IMAGE_TAG=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-latest

      - name: Install vind
        run: |
          curl -L https://github.com/loft-sh/vind/releases/latest/download/vind-linux-amd64 \
            -o /usr/local/bin/vind
          chmod +x /usr/local/bin/vind
          vind create mycluster
          vind use mycluster

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Helm dependency update
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update helm/app-chart

      - name: Helm deploy
        run: |
          helm upgrade --install myapp helm/app-chart \
            --namespace default \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ steps.tag.outputs.IMAGE_TAG }} \
            --wait --timeout 5m

      - name: Run smoke test
        run: |
          chmod +x ./scripts/test.sh
          ./scripts/test.sh